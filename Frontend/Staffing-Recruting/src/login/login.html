<div class="page-container">
    <div class="container">
        <div class="login-container">
            <div class="login-head">
                <h1>Login</h1>
                <h3>Welcome to Recruiting Platform</h3>
                <span>Login to Continue</span>
            </div>
            <form (ngSubmit)="loginUser()" #eventForm="ngForm">
                <div class="form-grid">
                    <div class="form-value">
                        <mat-form-field appearance="outline">
                            <mat-label>Username</mat-label>
                            <input matInput placeholder="John Deo" [(ngModel)]="login.userName" name="username">
                        </mat-form-field>
                    </div>
                    <div class="form-value">
                        <mat-form-field appearance="outline">
                            <mat-label>Password</mat-label>
                            <input matInput placeholder="*********" [(ngModel)]='login.password' name="password"
                                type="password">
                        </mat-form-field>
                    </div>
                    <div class="form-value">
                        <mat-form-field>
                            <mat-label>Login Role</mat-label>
                            <mat-select [(ngModel)]="login.role" name="role">
                                @for (role of userRole; track role.value) {
                                <mat-option [value]="role.value">{{role.viewValue}}</mat-option>
                                }
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div class="form-actions">
                    <button mat-raised-button type="submit">Submit</button>
                    <div class="register-user">
                        <span>New User? <a routerLink="/register">sign in</a></span> 
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
